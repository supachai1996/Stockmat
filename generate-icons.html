<!DOCTYPE html>
<html>
<head>
    <title>Generate Stockmat Icons</title>
</head>
<body>
    <h1>Stockmat Icon Generator</h1>
    <p>Click the buttons below to download the PNG icons</p>
    
    <button onclick="downloadIcon(192)">Download 192x192 icon</button>
    <button onclick="downloadIcon(512)">Download 512x512 icon</button>
    <button onclick="downloadMaskableIcon(192)">Download 192x192 Maskable</button>
    <button onclick="downloadMaskableIcon(512)">Download 512x512 Maskable</button>
    
    <script>
    function createIcon(size, maskable = false) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        
        // Background gradient
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#FF8C42');
        gradient.addColorStop(1, '#F77F00');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        
        // Rounded corners for maskable
        if (maskable) {
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = gradient;
            const radius = size * 0.25;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fill();
        }
        
        // Draw emoji-like box icon
        const boxSize = size * 0.5;
        const x = (size - boxSize) / 2;
        const y = (size - boxSize) / 2;
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.rect(x, y, boxSize, boxSize * 0.7);
        ctx.fill();
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.beginPath();
        ctx.rect(x, y + boxSize * 0.65, boxSize, boxSize * 0.25);
        ctx.fill();
        
        return canvas;
    }
    
    function downloadIcon(size) {
        const canvas = createIcon(size, false);
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `icon-${size}.png`;
        link.click();
    }
    
    function downloadMaskableIcon(size) {
        const canvas = createIcon(size, true);
        const link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = `icon-${size}-maskable.png`;
        link.click();
    }
    </script>
</body>
</html>
